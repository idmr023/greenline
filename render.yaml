services:
  - type: web
    name: greenline-backend
    runtime: node
    rootDir: backend
    healthCheckPath: /health
    buildCommand: npm install; npm run build
    startCommand: node --max-old-space-size=400 src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ORDERS_MAIL_TO
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        sync: false
      - key: RATE_LIMIT_MAX
        sync: false
      - key: LOGIN_RATE_LIMIT_MAX
        sync: false
      - key: OTP_RATE_LIMIT_MAX
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Cola de emails (BullMQ). Pega aquí el "Internal Connection String"
      # de la instancia Key-Value (Redis) `greenline-redis` en Render.
      # Creada vía dashboard o API. Si se omite, el backend usa una cola
      # en memoria (sin persistencia entre reinicios).
      - key: REDIS_URL
        sync: false
  # Cron anti-sleep: mantiene despierto el backend en el free tier (Render duerme tras inactividad).
  # Define KEEPALIVE_URL con la URL de producción (ej: https://greenline-backend.onrender.com/health).
  - type: cron
    name: greenline-keepalive
    runtime: node
    rootDir: backend
    schedule: */5 * * * *
    buildCommand: npm install --omit=dev
    startCommand: node scripts/keepalive.mjs
    envVars:
      - key: KEEPALIVE_URL
        sync: false
