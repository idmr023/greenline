# Preview Environments (opción B): cada Pull Request levanta una copia efímera
# del backend con el código del PR. Se actualiza con cada push y se destruye
# sola al cerrar/mergear el PR (más auto-limpieza por inactividad).
# Cobro prorrateado por segundo; como la base es free, los previews son free.
previews:
  generation: automatic
  expireAfterDays: 2

services:
  - type: web
    name: greenline-backend
    runtime: node
    rootDir: backend
    previews:
      plan: free
    healthCheckPath: /health
    buildCommand: npm install; npm run build
    startCommand: node --max-old-space-size=400 src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
        # TODO: apunta los previews a una DB de PRUEBA (nunca prod, se hereda si se omite).
        # previewValue: postgresql://usuario:clave@host:5432/greenline_test
      - key: DIRECT_URL
        sync: false
        # TODO: igual que DATABASE_URL, override de prueba para previews.
        # previewValue: postgresql://usuario:clave@host:5432/greenline_test
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_TEMP_SECRET
        sync: false
      - key: STAFF_GATE_CODE
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ORDERS_MAIL_TO
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        sync: false
      - key: RATE_LIMIT_MAX
        sync: false
      - key: LOGIN_RATE_LIMIT_MAX
        sync: false
      - key: OTP_RATE_LIMIT_MAX
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Cola de emails (BullMQ). Pega aquí el "Internal Connection String"
      # de la instancia Key-Value (Redis) `greenline-redis` en Render.
      # Creada vía dashboard o API. Si se omite, el backend usa una cola
      # en memoria (sin persistencia entre reinicios).
      - key: REDIS_URL
        sync: false
  # Cron anti-sleep: mantiene despierto el backend en el free tier (Render duerme tras inactividad).
  # Define KEEPALIVE_URL con la URL de producción (ej: https://greenline-backend.onrender.com/health).
  - type: cron
    name: greenline-keepalive
    runtime: node
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: npm install --omit=dev
    startCommand: node scripts/keepalive.mjs
    envVars:
      - key: KEEPALIVE_URL
        sync: false
  # Recovery de emails perdidos: reenvía pedidos con email_enviado=false de las últimas 72h.
  # Corre cada 30 min para cubrir gaps del fin de semana cuando el worker no estuvo activo.
  - type: cron
    name: greenline-email-recovery
    runtime: node
    rootDir: backend
    schedule: "*/30 * * * *"
    buildCommand: npm install --omit=dev
    startCommand: node scripts/recover-pending-emails.mjs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ORDERS_MAIL_TO
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
