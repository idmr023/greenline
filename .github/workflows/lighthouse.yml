name: Lighthouse

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: lhci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      # Bake placeholders al build: sin ellos createClient('') revienta el entry y NO_FCP
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key-0123456789abcdefghijklmnop
      VITE_API_URL: http://localhost:3000/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Lighthouse CI
        run: npx lhci autorun

      - name: Reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-reports
          path: lhci-reports/
