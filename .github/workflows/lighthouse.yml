name: Lighthouse

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: lhci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Lighthouse CI
        run: npx lhci autorun

      - name: Reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-reports
          path: lhci-reports/
