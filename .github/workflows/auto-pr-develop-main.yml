name: Auto-PR develop -> main

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: auto-pr-develop-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff develop..main
        id: diff
        run: |
          git fetch origin develop main
          COUNT=$(git rev-list --count origin/main..origin/develop)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "develop ahead of main by $COUNT commits"
          if [ "$COUNT" -eq 0 ]; then
            echo "No diff, skipping PR creation."
          fi

      - name: Create or reuse PR + enable auto-merge (squash)
        if: steps.diff.outputs.count != '0'
        env:
          # PAT (AUTO_MERGE_PAT): el merge lo hace el dueño del token → el push a
          # main SÍ dispara CI/Render checksPass. Sin el secret, fallback GITHUB_TOKEN
          # (el merge del bot NO dispara workflows en main → Render no desplegaría).
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          EXISTING=$(gh pr list --base main --head develop --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base main \
              --head develop \
              --title "Auto-PR: develop -> main" \
              --body "PR automático develop -> main. Auto-merge con squash cuando el check verify esté en verde (ruleset merge_verfication). Creado por .github/workflows/auto-pr-develop-main.yml"
            PR=$(gh pr list --base main --head develop --json number --jq '.[0].number')
          else
            PR="$EXISTING"
            echo "Reusing existing PR #$PR"
          fi
          MERGEABLE=$(gh pr view "$PR" --json mergeable --jq '.mergeable')
          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            echo "::error::PR #$PR tiene conflictos con main. Resuelve develop <- main y vuelve a pushear; auto-merge no puede completarse."
            gh pr comment "$PR" --body "⚠️ Conflictos con \`main\`: auto-merge quedará pausado hasta que se resuelvan (fusiona \`main\` en \`develop\` y pushea)."
            exit 1
          fi
          echo "Enabling auto-merge (squash) on PR #$PR (mergeable=$MERGEABLE)"
          gh pr merge --auto --squash "$PR"
