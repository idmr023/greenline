name: E2E

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/greenline_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/greenline_test
      JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-secret-0123456789
      JWT_TEMP_SECRET: ci-dummy-jwt-temp-secret-0123456789ab
      STAFF_GATE_CODE: "0000"
      FIELD_ENCRYPTION_KEY: ci-dummy-field-encryption-key-01234567
      SMTP_USER: ci@example.com
      SMTP_PASS: ci-dummy-smtp-pass
      EMAIL_FROM: GreenLine CI <ci@example.com>
      FRONTEND_URL: https://example.com
      PORT: "3000"
      VITE_API_URL: http://localhost:3000/api
      PLAYWRIGHT_API_URL: http://localhost:3000/api
      PLAYWRIGHT_BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - run: npm ci
      - run: cd backend && npm ci && npm run build

      - name: Build frontend (apunta al backend local)
        run: npm run build

      - name: Levantar backend + preview
        run: |
          (cd backend && node --max-old-space-size=400 src/index.js > /tmp/backend.log 2>&1 &) 
          (npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && curl -sf http://localhost:4173/ && break
            sleep 2
          done
          curl -sf http://localhost:3000/health && curl -sf http://localhost:4173/

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test

      - name: Logs (si falla)
        if: failure()
        run: tail -100 /tmp/backend.log; tail -50 /tmp/preview.log
